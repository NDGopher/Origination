# Ablation: OU calib + rest totals intensity off (iter5 winners removed)
project:
  name: origination
  seed: 42
  data_dir: data
  experiments_dir: experiments
  experiment_label: ablation_ou_rest_off

leagues:
  - code: E0
    name: Premier League
    understat: EPL
    fbref: Premier-League
    start_season: 2014
    end_season: null

data:
  football_data:
    enabled: true
    base_url: https://www.football-data.co.uk/mmz4281
    preferred_close_books: [PSC, B365C, AvgC, PS, B365, Avg]
  understat: {enabled: true, base_url: https://understat.com}
  fbref: {enabled: false}
  align: {require_odds: true, min_date: "2014-08-01"}

features:
  groups:
    basic_form: true
    xg_form: true
    shots: true
    elo: true
    schedule: true
    understat_advanced: true
    h2h: false
    market_prior: false
  windows: [3, 5, 10]
  ewm_span: 10
  elo: {k: 20.0, home_advantage: 60.0, initial: 1500.0}
  context_adjustments:
    enabled: true
    motivation:
      enabled: true
      season_length: 38
      safety_rank: 17
      title_pts_gap: 6.0
      releg_pts_gap: 6.0
      euro_pts_gap: 6.0
      min_games: 8
      late_games_left: 12
      stakes_coef: 0.10
      title_coef: 0.0
      releg_coef: 0.0
      dead_rubber_coef: 0.0
      motivation_diff_coef: 0.0
    coaching_change:
      enabled: true
      new_coach_days: 60
      new_coach_games: 8
      bounce_coef: 0.05
      changes_path: data/interim/coaching_changes.csv
    referee:
      enabled: true
      min_prior_games: 5
      tempo_coef: 0.0
      card_bias_coef: 0.5
    injuries: {enabled: false}
    lineups: {enabled: false}
    formations: {enabled: false}
    weather: {enabled: false}
    travel: {enabled: false}

model:
  type: dixon_coles
  max_goals: 10
  dixon_coles:
    rho_init: -0.05
    xi: 0.0018
    intensity_source: xg
    intensity_adjustments:
      enabled: true
      ppda_coef: 0.01
      deep_coef: 0.03
      congestion_coef: 0.0
      rest_coef: 0.0
  calibration:
    method: temperature
    ou_method: none
    holdout_seasons: 1

backtest:
  mode: expanding
  min_train_matches: 500
  fold: season
  markets: ["1x2", "ou25", "ah"]
  edge_threshold: 0.03
  edge_thresholds: [0.02, 0.03, 0.04, 0.05]
  stake: {method: flat, unit: 1.0, kelly_fraction: 0.25, max_stake: 5.0}
  odds: {remove_vig: power, min_odds: 1.20, max_odds: 15.0}
