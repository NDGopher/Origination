# Step 1b: Platt calibration for comparison
project:
  name: origination
  seed: 42
  data_dir: data
  experiments_dir: experiments
  experiment_label: step1_platt_goals

leagues:
  - code: E0
    name: Premier League
    understat: EPL
    fbref: Premier-League
    start_season: 2014
    end_season: null

data:
  football_data:
    enabled: true
    base_url: https://www.football-data.co.uk/mmz4281
    preferred_close_books: [PSC, B365C, AvgC, PS, B365, Avg]
  understat:
    enabled: true
    base_url: https://understat.com
  fbref:
    enabled: false
  align:
    require_odds: true
    min_date: "2014-08-01"

features:
  groups:
    basic_form: true
    xg_form: true
    shots: true
    elo: true
    schedule: true
    understat_advanced: false
    h2h: false
    market_prior: false
  windows: [3, 5, 10]
  ewm_span: 10
  elo: {k: 20.0, home_advantage: 60.0, initial: 1500.0}
  context_adjustments:
    enabled: false

model:
  type: dixon_coles
  max_goals: 10
  dixon_coles:
    rho_init: -0.05
    xi: 0.0018
    intensity_source: goals
    intensity_adjustments: {enabled: false}
  calibration:
    method: platt
    holdout_seasons: 1

backtest:
  mode: expanding
  min_train_matches: 500
  fold: season
  markets: ["1x2", "ou25"]
  edge_threshold: 0.03
  edge_thresholds: [0.02, 0.03, 0.04, 0.05]
  stake: {method: flat, unit: 1.0, kelly_fraction: 0.25, max_stake: 5.0}
  odds: {remove_vig: power, min_odds: 1.20, max_odds: 15.0}
